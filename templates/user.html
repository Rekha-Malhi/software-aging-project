<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
</head>
<body>

<h2>User: {{ email }}</h2>

<table border="1">
<tr>
    <th>CPU</th>
    <th>Memory</th>
    <th>Time</th>
</tr>

{% for d in data %}
<tr>
    <td>{{ d.cpu }}</td>
    <td>{{ d.memory }}</td>
    <td>{{ d.time }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
