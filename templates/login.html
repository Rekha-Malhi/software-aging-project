<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background:#0a0f1f;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:sans-serif;
        }

        form {
            background:#111827;
            padding:30px;
            border-radius:10px;
        }

        input, button {
            display:block;
            margin:10px 0;
            padding:10px;
            width:200px;
        }
    </style>
</head>

<body>

<form method="POST">
    <h2>Login</h2>
    <input name="email" placeholder="Email">
    <input name="password" type="password" placeholder="Password">
    <button>Login</button>
</form>

</body>
</html>
